<div class="panel-scroll">
  <div class="panel-heading sticky">
    <div class="task-panel-title-row">
      <button type="button" class="btn-link task-collapse-btn" data-panel-collapse title="Close" aria-label="Close">×</button>
      <h2>New Project</h2>
    </div>
  </div>

  <form hx-post="/projects/create-open" hx-target="#app-main" hx-swap="outerHTML" class="task-form" style="margin-top:.95rem">
    <input type="hidden" name="f_view" value="{{ filters.view }}">
    <input type="hidden" name="f_show_closed" value="{% if filters.show_closed %}1{% endif %}">
    <input type="hidden" name="f_stale_days" value="{{ filters.stale_days }}">

    <label>Name<input name="name" value="" placeholder="Project name…" required autofocus></label>
    <div class="form-grid">
      <label>Color
        <input type="color" name="color" value="#2e6fd8" class="ms-color-input">
      </label>
    </div>
    <label>Description<textarea name="description" rows="3"></textarea></label>
    <div class="panel-actions-row">
      <button type="submit">Save Project</button>
    </div>
    <p class="muted draft-hint">Add tasks to this project once you save.</p>
  </form>
</div>

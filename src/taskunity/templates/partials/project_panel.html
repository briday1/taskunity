<div class="panel-scroll">
  <div class="panel-heading sticky">
    <div class="panel-heading-copy">
      <span class="panel-eyebrow">Project</span>
      <h2>{{ selected_project.name }}</h2>
    </div>
    <div class="panel-header-actions">
      <button type="button" class="btn-link task-collapse-btn" data-panel-collapse title="Close details" aria-label="Close details">×</button>
    </div>
  </div>

  <form hx-post="/projects/{{ selected_project.id }}/save" hx-target="#app-main" hx-swap="outerHTML" class="task-form entity-form">
    <input type="hidden" name="f_view" value="{{ filters.view }}">
    <input type="hidden" name="f_stale_days" value="{{ filters.stale_days }}">
    <input type="hidden" name="f_show_closed" value="{% if filters.show_closed %}1{% endif %}">
    <input type="hidden" name="f_hide_done" value="{% if filters.hide_done %}1{% endif %}">
    <input type="hidden" name="f_hide_old" value="{% if filters.hide_old %}1{% endif %}">

    <label class="title-field">
      <span>Name</span>
      <input name="name" value="{{ selected_project.name }}" required>
    </label>

    <div class="form-grid">
      <label>
        <span>Color</span>
        <input type="color" name="color" value="{{ selected_project.color or '#2e6fd8' }}" class="ms-color-input">
      </label>
    </div>

    <label>
      <span>Description</span>
      <textarea name="description" rows="3">{{ selected_project.description }}</textarea>
    </label>

    <div class="panel-actions-row"><button type="submit">Save changes</button></div>
  </form>

  <section class="subsection">
    <h3>Tasks <span class="notes-count-badge">{{ project_tasks|length }}</span></h3>
    <div class="ms-task-box">
      <ul class="ms-task-list">
        {% for t in project_tasks %}
          <li class="ms-task {{ t.status }}">
            <button type="button" class="ms-task-open" hx-get="/tasks/{{ t.id }}/panel?view={{ filters.view }}{% if filters.hide_old %}&hide_old=1{% endif %}{% if filters.hide_done %}&hide_done=1{% endif %}&stale_days={{ filters.stale_days }}" hx-target="#task-panel" hx-swap="innerHTML">
              <span class="ms-task-title">{{ t.title }}</span>
              <span class="ms-task-meta">
                <span class="status-pill {{ t.status }}">{{ t.status }}</span>
                {% if t.due_date %}<span class="due-label {{ t.due_date|due_class }}">due {{ t.due_date }}</span>{% endif %}
              </span>
            </button>
          </li>
        {% else %}
          <li class="muted ms-empty">No tasks yet. Use “+ New task” below.</li>
        {% endfor %}
      </ul>
      <div class="ms-new-task-bar">
        <button type="button" class="ms-new-task-btn"
                hx-get="/new/task/panel?view=list&amp;project={{ selected_project.id }}{% if filters.hide_old %}&amp;hide_old=1{% endif %}{% if filters.hide_done %}&amp;hide_done=1{% else %}&amp;show_done=1{% endif %}&amp;stale_days={{ filters.stale_days }}"
                hx-target="#task-panel" hx-swap="innerHTML"
                title="Add tasks to this project">+ New task</button>
      </div>
    </div>
  </section>

  <form action="/projects/{{ selected_project.id }}/delete" method="post"
        onsubmit="return confirm('Delete project {{ selected_project.name }}? Tasks will not be deleted.')"
        class="danger-zone">
    <input type="hidden" name="f_view" value="{{ filters.view }}">
    <input type="hidden" name="f_stale_days" value="{{ filters.stale_days }}">
    <input type="hidden" name="f_show_closed" value="{% if filters.show_closed %}1{% endif %}">
    <button type="submit">Delete Project</button>
  </form>

  <p class="task-id-footer">Project ID: <span class="mono">{{ selected_project.id }}</span></p>
</div>

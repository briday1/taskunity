<div class="panel-scroll">
  <div class="panel-heading sticky">
    <div class="task-panel-title-row">
      <button type="button" class="btn-link task-collapse-btn" data-panel-collapse title="Close" aria-label="Close">×</button>
      <h2>New Milestone</h2>
    </div>
  </div>

  <form hx-post="/milestones/create" hx-target="#app-main" hx-swap="outerHTML" class="task-form" style="margin-top:.95rem">
    <input type="hidden" name="f_view" value="{{ filters.view }}">
    <input type="hidden" name="f_show_closed" value="{% if filters.show_closed %}1{% endif %}">
    <input type="hidden" name="f_stale_days" value="{{ filters.stale_days }}">

    <label>Title<input name="title" value="" placeholder="Milestone title…" required autofocus></label>
    <div class="form-grid">
      <label>Status
        <select name="status">
          <option value="planned">planned</option>
          <option value="active" selected>active</option>
          <option value="done">done</option>
        </select>
      </label>
      <label>Color
        <input type="color" name="color" value="#3567e0" class="ms-color-input">
      </label>
    </div>
    <label>Summary<textarea name="summary" rows="2"></textarea></label>
    <label>Description<textarea name="description" rows="5"></textarea></label>
    <div class="form-grid">
      <label>Start date<input type="date" name="start_date" value=""></label>
      <label>Target date<input type="date" name="target_date" value=""></label>
    </div>
    <div class="panel-actions-row">
      <button type="submit">Save Milestone</button>
    </div>
    <p class="muted draft-hint">Add tasks to this milestone once you save.</p>
  </form>
</div>
